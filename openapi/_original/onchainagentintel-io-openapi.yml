openapi: 3.1.0
info:
  title: Agent Zero — ERC-8004 Agent Readiness & Trust intelligence
  version: 1.9.0
  summary: 'Machine-discoverable API for the ERC-8004 agent economy on Base and Ethereum — a trust filter over the on-chain registry: indexes registered agents, enriches with live endpoint probes and payment activity, and scores each for readiness and trust.'
  description: 'Curated public spec covering (a) the free `/v1/public/*` and discovery surfaces (`/agent.json`, `/.well-known/agent-card.json`, `/mcp`) and (b) the paid x402 intelligence endpoints (`/v1/intel/*`, `/v1/audit`, `/v1/evaluate`).


    Paid operations return HTTP 402 with a buyer-visible `preview` envelope; retry with an `X-PAYMENT` header to settle in USDC (Base or Ethereum) or ETH. See https://onchainagentintel.io/docs for the full flow.


    **Make your first paid call:** the `GET /v1/intel/agent/{agent_id}` operation carries an inline runnable quickstart (curl / Python / TypeScript) for the cheapest paid endpoint ($0.10 USDC on Base). Copy-paste, sign an EIP-3009 `transferWithAuthorization`, and get a paid 200 in one round-trip.


    Live-sourced from the on-chain ERC-8004 tokenURI manifest for agentId 19353 — never a hardcoded snapshot.'
  contact:
    name: Agent Zero
    url: https://onchainagentintel.io
  license:
    name: Public API — no license claim
    url: https://onchainagentintel.io/docs
servers:
- url: https://api.onchainagentintel.io
  description: Public API
tags:
- name: public
  description: Free endpoints — no payment, no auth.
- name: paid-x402
  description: Paid endpoints — settle with X-PAYMENT header per x402.
components:
  securitySchemes:
    x402:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: x402 payment envelope (base64-encoded JSON). Paid endpoints return HTTP 402 with an `accepts[]` list of accepted payment methods (USDC on Base/Ethereum via EIP-3009, or native ETH). Sign a payment authorization matching one of those entries, base64-encode it, and retry with this header set to receive the 200 response. See https://onchainagentintel.io/docs and https://api.onchainagentintel.io/agent.json for the full flow.
      x-x402:
        version: 1
        settlement_networks:
        - base
        - ethereum
        pay_to: '0xaCd134d2AAd0b868EDb395F7d151864188caaF1a'
  responses:
    PaymentRequired:
      description: Payment required. Retry with X-PAYMENT header.
      headers:
        Link:
          description: RFC 8288 Link header (task 0179, per-agent operations only). Comma-separated values include `rel="alternate"; type="text/html"` pointing at the free per-agent SEO page (or the chain brief fallback) and `rel="describedby"` pointing at `https://api.onchainagentintel.io/llms.txt`.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required:
            - x402Version
            - accepts
            properties:
              x402Version:
                type: integer
                example: 1
              accepts:
                type: array
                items:
                  type: object
                  properties:
                    scheme:
                      type: string
                      example: exact
                    network:
                      type: string
                      example: base-mainnet
                    maxAmountRequired:
                      type: string
                      example: '100000'
                    payTo:
                      type: string
                      example: '0xaCd134d2AAd0b868EDb395F7d151864188caaF1a'
                    asset:
                      type: string
                      example: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                    maxTimeoutSeconds:
                      type: integer
                      example: 300
                    extra:
                      type: object
                      additionalProperties: true
                    resource:
                      type: string
                      format: uri
                      description: Canonical URL of the paid resource this accept entry unlocks. Discovery indexers key on this field.
                      example: https://api.onchainagentintel.io/v1/intel/agent_profile
                    description:
                      type: string
                      description: Agent-readable one-line summary of what the paid resource returns. Rendered in the discovery UI.
                      example: 'Paid ERC-8004 agent intelligence (agent_profile): trust verdict, reputation, and commerce-backed signals for on-chain agents on Base + Ethereum.'
                    mimeType:
                      type: string
                      description: MIME type of the 200 response served on successful payment.
                      example: application/json
              preview:
                type: object
                description: Buyer-visible teaser. Contains a small set of unlocked fields (identifiers, high-level readiness bucket + score, capability count, boolean coverage flags) so integrators can decide whether to pay. Full paid response fields stay gated behind the 200.
                additionalProperties: true
              see_also:
                type: object
                description: Task 0179 (per-agent operations only). Pointers to the free 200-returning surface that answers the same question. Additive to `preview` / `accepts[]` — never replaces them. `free_page` is the direct per-agent SEO page URL when one exists (built from `onchainagentintel-site/build_seo_pages.py`); `free_page_fallback` is the chain brief (`/chains/{chain}`); `free_endpoints[]` enumerates the public `/v1/public/*` surfaces; `llms_txt` points at the site+API map.
                properties:
                  free_page:
                    type: string
                    format: uri
                    example: https://onchainagentintel.io/agents/base/19353
                  free_page_fallback:
                    type: string
                    format: uri
                    example: https://onchainagentintel.io/chains/base
                  free_endpoints:
                    type: array
                    items:
                      type: string
                      format: uri
                  llms_txt:
                    type: string
                    format: uri
                    example: https://api.onchainagentintel.io/llms.txt
                additionalProperties: true
