  /v1/intel/agent/{agent_id}:
    get:
      tags:
      - paid-x402
      summary: Agent Intelligence — Profile Lookup
      description: '**Runnable quickstart — Make your first paid call.** This is the cheapest paid endpoint ($0.10 USDC on Base, settled via x402 / EIP-3009 `transferWithAuthorization`). See the `curl`, `Python`, and `TypeScript` tabs below for a copy-paste 402 -> pay -> 200 flow. The server pays gas; your wallet needs only >= $0.10 USDC on Base and NO ETH. Payment settles to the Safe treasury `0xaCd134d2AAd0b868EDb395F7d151864188caaF1a` — never an EOA signer. Reference implementation: `smartcontractauditpro/x402_smoke.py`.


        Full enriched profile for any ERC-8004 agent. On-chain registration metadata; live endpoint enrichment including MCP tool inventories and OpenAPI method inventories where the agent publishes them; owner identity resolved via ENS, Basenames, and Farcaster; explorer-verified contract data with proxy-implementation resolution; host health (reachability and TLS expiry); the buyer-POV Agent Readiness & Trust score (deterministic 0-100 composite with bucket Transact-ready / Promising / Not ready / Unrated, four sub-scores, and human-readable reasons — the sole categorical trust signal); and on-chain payment history (ETH + USDC received). Continuously refreshed from live endpoint probes and on-chain activity scans across Base and Ethereum.


        **Payment (x402):**

        - base: 0.10 USDC (EIP-3009)

        - ethereum: 0.10 USDC (EIP-3009)


        The 200 response body carries paid-gated intel; field-level schemas are intentionally not published. See the 402 `preview` block for the buyer-visible teaser.'
      operationId: paid_agent_intel_profile_get
      security:
      - x402: []
      responses:
        '200':
          description: Paid intel. Body shape is opaque in this public spec (paid-gated). Integrators should use the 402 preview envelope + the human docs at https://onchainagentintel.io/docs for field lists.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '402':
          $ref: '#/components/responses/PaymentRequired'
      parameters:
      - name: agent_id
        in: path
        required: true
        description: integer — ERC-8004 agentId (e.g. 19353 for Agent Zero). Discover via /v1/intel/search or read directly from the on-chain IdentityRegistry.
        schema:
          type: integer
          minimum: 0
      - name: chain
        in: query
        required: false
        description: 'string (optional) — base | ethereum. Default: base.'
        schema:
          type: string
      - name: wallet
        in: query
        required: false
        description: string (optional) — 0x-prefixed payer address. If you have an active /v1/intel/subscribe subscription, pass it to bypass per-call payment.
        schema:
          type: string
      x-codeSamples:
      - lang: bash
        label: curl
        source: '# 1) Unpaid — get the 402 x402 challenge (no wallet needed).

          curl -i https://api.onchainagentintel.io/v1/intel/agent/19353

          # HTTP/1.1 402 Payment Required

          # {

          #   "x402Version": 1,

          #   "accepts": [

          #     { "scheme": "exact", "network": "base-mainnet",

          #       "maxAmountRequired": "100000",  # $0.10 USDC (6 decimals)

          #       "payTo": "0xaCd134d2AAd0b868EDb395F7d151864188caaF1a",  # Safe treasury

          #       "asset": "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",  # USDC on Base

          #       "extra": { "name": "USD Coin", "version": "2" } },

          #     ...

          #   ],

          #   "preview": { /* buyer-visible teaser */ }

          # }


          # 2) Sign an EIP-3009 transferWithAuthorization off-chain — server

          #    pays gas. Sample signer code lives in the Python / TypeScript

          #    tabs. Result: a base64-encoded X-PAYMENT envelope.


          # 3) Retry with the X-PAYMENT header — server settles + returns 200.

          X_PAYMENT="<base64 x402 envelope from step 2>"

          curl -i -H "X-PAYMENT: $X_PAYMENT" https://api.onchainagentintel.io/v1/intel/agent/19353

          # HTTP/1.1 200 OK

          # { "x402": { "settled": true, "tx": "0x..." },

          #   "result": { /* opaque paid intel */ } }

          '
      - lang: Python
        label: Python
        source: "# quickstart_x402.py — make your first paid call ($0.10 USDC on Base).\n# Deps:   pip install requests eth-account web3\n# Wallet: needs >= $0.10 USDC on Base. NO gas (server pays).\n# Key:    set X402_TEST_PRIVATE_KEY — never commit a real key.\nimport base64, json, os, secrets, time\nimport requests\nfrom eth_account import Account\nfrom eth_account.messages import encode_typed_data\n\nURL = \"https://api.onchainagentintel.io/v1/intel/agent/19353\"\n\n# 1) Unpaid — get the 402 challenge.\nr = requests.get(URL, timeout=15)\nassert r.status_code == 402, r.status_code\nchallenge = r.json()\naccept = next(\n    a for a in challenge[\"accepts\"] if a[\"network\"] == \"base-mainnet\"\n)\n# accept: scheme=exact, payTo=<Safe>, asset=<USDC on Base>,\n#         maxAmountRequired=100000 ($0.10 USDC).\n\n# 2) Sign an EIP-3009 transferWithAuthorization off-chain.\nacct  = Account.from_key(os.environ[\"X402_TEST_PRIVATE_KEY\"])   # PLACEHOLDER\nnonce = secrets.token_bytes(32)\nnow \
          \  = int(time.time())\nvalid_before = now + 600\nsignable = encode_typed_data(\n    domain_data={\n        \"name\":     accept[\"extra\"][\"name\"],\n        \"version\":  accept[\"extra\"][\"version\"],\n        \"chainId\": 8453,\n        \"verifyingContract\": accept[\"asset\"],\n    },\n    message_types={\"TransferWithAuthorization\": [\n        {\"name\": \"from\",        \"type\": \"address\"},\n        {\"name\": \"to\",          \"type\": \"address\"},\n        {\"name\": \"value\",       \"type\": \"uint256\"},\n        {\"name\": \"validAfter\",  \"type\": \"uint256\"},\n        {\"name\": \"validBefore\", \"type\": \"uint256\"},\n        {\"name\": \"nonce\",       \"type\": \"bytes32\"},\n    ]},\n    message_data={\n        \"from\": acct.address, \"to\": accept[\"payTo\"],\n        \"value\": int(accept[\"maxAmountRequired\"]),\n        \"validAfter\": 0, \"validBefore\": valid_before, \"nonce\": nonce,\n    },\n)\nsigned = Account.sign_message(signable, private_key=acct.key)\n\
          sig = signed.signature.hex()\nif not sig.startswith(\"0x\"):\n    sig = \"0x\" + sig\n\n# 3) Retry with X-PAYMENT (base64-encoded x402 envelope) — get 200.\nenvelope = {\n    \"x402Version\": 1, \"scheme\": \"exact\",\n    \"network\": \"base-mainnet\",\n    \"payload\": {\n        \"authorization\": {\n            \"from\": acct.address, \"to\": accept[\"payTo\"],\n            \"value\": accept[\"maxAmountRequired\"],\n            \"validAfter\": 0, \"validBefore\": valid_before,\n            \"nonce\": \"0x\" + nonce.hex(),\n        },\n        \"signature\": sig,\n    },\n}\nheader = base64.b64encode(json.dumps(envelope).encode()).decode()\npaid = requests.get(URL, headers={\"X-PAYMENT\": header}, timeout=30)\nprint(paid.status_code, paid.json().get(\"x402\"))\n# -> 200 {'settled': True, 'tx': '0x...'}\n# `paid.json()['result']` carries the opaque paid intel (buyer-gated).\n\n# Reference implementation: smartcontractauditpro/x402_smoke.py.\n"
      - lang: TypeScript
        label: TypeScript
        source: "// quickstart-x402.ts — make your first paid call ($0.10 USDC on Base).\n// Deps:   npm i viem\n// Wallet: needs >= $0.10 USDC on Base. NO gas (server pays).\n// Key:    set X402_TEST_PRIVATE_KEY — never commit a real key.\nimport { privateKeyToAccount } from \"viem/accounts\";\nimport { toHex } from \"viem\";\n\nconst URL = \"https://api.onchainagentintel.io/v1/intel/agent/19353\";\n\n// 1) Unpaid — get the 402 challenge.\nconst r1 = await fetch(URL);\nif (r1.status !== 402) throw new Error(`expected 402, got ${r1.status}`);\nconst challenge = await r1.json();\nconst accept   = challenge.accepts.find((a: any) => a.network === \"base-mainnet\");\n// accept: scheme=\"exact\", payTo=<Safe>, asset=<USDC on Base>,\n//         maxAmountRequired=\"100000\" ($0.10 USDC).\n\n// 2) Sign an EIP-3009 transferWithAuthorization off-chain.\nconst account = privateKeyToAccount(\n  process.env.X402_TEST_PRIVATE_KEY as `0x${string}`,  // PLACEHOLDER\n);\nconst nonceBytes = crypto.getRandomValues(new\
          \ Uint8Array(32));\nconst nonce      = toHex(nonceBytes);\nconst now         = Math.floor(Date.now() / 1000);\nconst validBefore = BigInt(now + 600);\nconst authorization = {\n  from:        account.address,\n  to:          accept.payTo,\n  value:       BigInt(accept.maxAmountRequired),\n  validAfter:  0n,\n  validBefore,\n  nonce,\n} as const;\nconst signature = await account.signTypedData({\n  domain: {\n    name:              accept.extra.name,\n    version:           accept.extra.version,\n    chainId:           8453,\n    verifyingContract: accept.asset,\n  },\n  types: {\n    TransferWithAuthorization: [\n      { name: \"from\",        type: \"address\" },\n      { name: \"to\",          type: \"address\" },\n      { name: \"value\",       type: \"uint256\" },\n      { name: \"validAfter\",  type: \"uint256\" },\n      { name: \"validBefore\", type: \"uint256\" },\n      { name: \"nonce\",       type: \"bytes32\" },\n    ],\n  },\n  primaryType: \"TransferWithAuthorization\"\
          ,\n  message: authorization,\n});\n\n// 3) Retry with X-PAYMENT (base64-encoded x402 envelope) — get 200.\nconst envelope = {\n  x402Version: 1,\n  scheme:  \"exact\",\n  network: \"base-mainnet\",\n  payload: {\n    authorization: {\n      from: authorization.from,\n      to:   authorization.to,\n      value:       accept.maxAmountRequired,\n      validAfter:  0,\n      validBefore: Number(validBefore),\n      nonce,\n    },\n    signature,\n  },\n};\nconst header = Buffer.from(JSON.stringify(envelope)).toString(\"base64\");\nconst r2 = await fetch(URL, { headers: { \"X-PAYMENT\": header } });\nconsole.log(r2.status, (await r2.json()).x402);\n// -> 200 { settled: true, tx: \"0x...\" }\n// `.result` on the paid response carries the opaque paid intel (buyer-gated).\n"
