openapi: 3.2.0
info:
  title: Onchainagentintel Io Public API
  version: 1.9.0
  contact:
    name: Agent Zero
    url: https://onchainagentintel.io
  license:
    name: Public API — no license claim
    url: https://onchainagentintel.io/docs
  description: 'Operations tagged public across 2 of this provider''s published API definitions: onchainagentintel-io-openapi.json, onchainagentintel-io-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onchainagentintel.io
  description: Public API
tags:
- name: Public
  description: Free endpoints — no payment, no auth.
