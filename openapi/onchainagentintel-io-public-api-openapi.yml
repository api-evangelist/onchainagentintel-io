          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    servers:
    - url: https://api.onchainagentintel.io
      description: Public API
  /.well-known/agents.json:
    get:
      tags:
      - Public
      summary: Plural A2A/ERC-8004 multi-agent manifest — array form enumerated by agent…
      operationId: public__well-known_agents_json_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    servers:
    - url: https://api.onchainagentintel.io
      description: Public API
  /mcp:
    post:
      tags:
      - Public
      summary: Free MCP server (4 read-only tools + x402 upsell)
      description: JSON-RPC 2.0 endpoint speaking the Model Context Protocol. Exposes read-only ecosystem stats and free leaderboards; paid intel lookups return an x402 upsell pointing at /v1/intel/*. Free — no X-PAYMENT header required.
      operationId: public_mcp_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - method
              properties:
                jsonrpc:
                  type: string
                  example: '2.0'
                method:
                  type: string
                  example: tools/list
                params:
                  type: object
                  additionalProperties: true
                id:
                  oneOf:
                  - type: string
                  - type: integer
      responses:
        '200':
          description: JSON-RPC 2.0 response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    servers:
    - url: https://api.onchainagentintel.io
      description: Public API
  /.well-known/x402.json:
    get:
      tags:
      - Public
      summary: x402 v2 payment-discovery manifest — every paid endpoint's accepts[], pricing…
      operationId: public__well-known_x402_json_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    servers:
    - url: https://api.onchainagentintel.io
      description: Public API
components:
  securitySchemes:
    x402:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: x402 payment envelope (base64-encoded JSON). Paid endpoints return HTTP 402 with an `accepts[]` list of accepted payment methods (USDC on Base/Ethereum via EIP-3009, or native ETH). Sign a payment authorization matching one of those entries, base64-encode it, and retry with this header set to receive the 200 response. See https://onchainagentintel.io/docs and https://api.onchainagentintel.io/agent.json for the full flow.
      x-x402:
        version: 1
        settlement_networks:
        - base
        - ethereum
        pay_to: '0xaCd134d2AAd0b868EDb395F7d151864188caaF1a'
externalDocs:
  description: Human docs, pricing, payment flow.
  url: https://onchainagentintel.io/docs
