- aid: onchainagentintel-io:agent-zero-a2a-agent
  name: Agent Zero A2A Agent
  description: >-
    Agent2Agent surface: an agent card served from https://onchainagentintel.io/.well-known/agent-card.json
    (mirrored on www and api hosts) naming the JSON-RPC endpoint https://api.onchainagentintel.io/a2a/v1
    and sixteen skills — x402 settlement, the free MCP server, the nine paid intel services, smart-contract
    audit, ERC-8183 evaluation and the free public surfaces — under a required a2a-x402 v0.2 payment extension
    settled to a Safe on Base or Ethereum. The card carries capabilities as an object and skills as an
    array but no top-level protocolVersion, so it grades flavored against A2A 1.0.0; the legacy /.well-known/agent.json
    declares protocolVersion 0.3.0. Streaming and push notifications are declared unsupported.
  humanURL: https://onchainagentintel.io/docs
  baseURL: https://api.onchainagentintel.io/a2a/v1
