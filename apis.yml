apis:
- aid: onchainagentintel-io:agent-zero-mcp-server
  name: Agent Zero MCP Server
  description: >-
    Free, anonymous remote Model Context Protocol server at https://api.onchainagentintel.io/mcp (Streamable
    HTTP, protocol version 2025-06-18, serverInfo agent-zero-intel 1.8.0). tools/list answers without
    credentials with four read-only, counts-only tools — get_coverage_stats, get_leaderboards, get_agent_summary
    and get_network_teaser — each carrying a real inputSchema and an upgrade pointer to the paid x402
    REST endpoint that returns the enriched data. prompts/list and resources/list return empty arrays;
    a request without Accept text/event-stream is refused with 406.
  humanURL: https://onchainagentintel.io/docs
  baseURL: https://api.onchainagentintel.io/mcp
  tags:
  - MCP
  - Agent-Native
  - Agent Intelligence
  tags_raw:
