policies:
- name: Caching
  description: Public endpoints are cached for 5 minutes (docs; cache-control max-age=300), so polling faster than that returns the same snapshot.
- name: Payment timeout
  description: Each x402 accepts[] entry carries maxTimeoutSeconds 300 — the window in which a signed payment authorization is honoured.
