description: >-
  No rate limits are documented anywhere on the docs, services or llms.txt surfaces, the OpenAPI declares no
  429 response, and live unauthenticated responses observed 2026-09-19 (200 on /v1/public/stats, 402 on
  /v1/intel/agent/19353) carried no RateLimit-*, X-RateLimit-* or Retry-After headers — only
  cache-control: public, max-age=300 on public endpoints. Paid endpoints are metered by price rather than by
  quota. An honest zero: limits undocumented.
